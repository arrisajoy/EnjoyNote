    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // ==================== PWA MANIFEST & OFFLINE CACHE SETUP ====================
        (function setupPWA() {
            const appIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="115" fill="#4A2545"/><circle cx="256" cy="256" r="190" fill="#FCE7F3"/><circle cx="256" cy="240" r="95" fill="#FFE4D6"/><path d="M160 220 C160 120, 352 120, 352 220 Z" fill="#3B2E2A"/><circle cx="220" cy="235" r="12" fill="#261A16"/><circle cx="292" cy="235" r="12" fill="#261A16"/><path d="M235 270 Q256 290 277 270" stroke="#261A16" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="256" cy="340" rx="75" ry="55" fill="#DDA668"/><circle cx="256" cy="335" r="12" fill="#261A16"/></svg>`;
            const iconDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(appIconSvg);

            const manifestObj = {
                name: 'Enjoy note - สมุดโน๊ต PDF อัจฉริยะ',
                short_name: 'Enjoy note',
                description: 'จดโน๊ต อ่าน PDF ปกสมุดสวย ใช้งานได้แม้ไม่มีอินเทอร์เน็ต',
                start_url: location.href.split('#')[0],
                scope: './',
                display: 'standalone',
                orientation: 'any',
                background_color: '#19141C',
                theme_color: '#4A2545',
                icons: [
                    { src: iconDataUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
                    { src: iconDataUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const linkEl = document.createElement('link');
            linkEl.rel = 'manifest';
            linkEl.href = manifestUrl;
            document.head.appendChild(linkEl);

            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.href = iconDataUrl;
            document.head.appendChild(appleIcon);

            // Register Service Worker for 100% Offline Support
            if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                const swCode = `
                    const CACHE_NAME = 'enjoy-note-offline-v2';
                    const CORE_ASSETS = [
                        './',
                        './index.html',
                        'https://cdn.tailwindcss.com',
                        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css',
                        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
                        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
                    ];
                    self.addEventListener('install', (event) => {
                        self.skipWaiting();
                        event.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => {
                                return Promise.allSettled(CORE_ASSETS.map(url => cache.add(url)));
                            })
                        );
                    });
                    self.addEventListener('activate', (event) => {
                        event.waitUntil(self.clients.claim());
                    });
                    self.addEventListener('fetch', (event) => {
                        if (event.request.method !== 'GET') return;
                        event.respondWith(
                            caches.match(event.request).then((cached) => {
                                const networkFetch = fetch(event.request).then((response) => {
                                    if (response && (response.status === 200 || response.type === 'opaque')) {
                                        const clone = response.clone();
                                        caches.open(CACHE_NAME).then((cache) => cache.put(event.request, clone));
                                    }
                                    return response;
                                }).catch(() => cached);
                                return cached || networkFetch;
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        })();

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gnPurple: '#4A2545',
                        gnPurpleDark: '#361932',
                        gnAccent: '#7C3AED',
                        gnBg: '#F6F3F7'
                    },
                    fontFamily: {
                        sans: ['Anuphan', 'Sarabun', 'sans-serif']
                    }
                }
            }
        }
    </script>

        }

    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // ==================== PWA INSTALL PROMPT HANDLER ====================
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
        });

        async function triggerInstallApp() {
            if (deferredInstallPrompt) {
                deferredInstallPrompt.prompt();
                const { outcome } = await deferredInstallPrompt.userChoice;
                if (outcome === 'accepted') {
                    showToast('กำลังติดตั้งแอป Enjoy note ลงในเครื่อง... 🎉');
                }
                deferredInstallPrompt = null;
                return;
            }
            showModal(
                'วิธีติดตั้งเป็นแอปแท้ (ใช้งานตอนไม่มีเน็ตได้ 100%) 📲',
                `

        function handleCustomAppLogoUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 320;
                    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    appData.customLogoUrl = canvas.toDataURL('image/jpeg', 0.88);
                    applyCustomAppLogo();
                    saveAllToStorage(false);
                    showToast('เปลี่ยนรูปภาพโลโก้แอปเรียบร้อยแล้ว! ✨');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        async function handleImportPdfFile(input) {
            const file = input.files[0];
            if (!file) return;
            showToast('กำลังนำเข้าไฟล์ PDF... ⏳');
            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64Data = e.target.result;
                    const loadingTask = pdfjsLib.getDocument({ data: atob(base64Data.split(',')[1]) });
                    const pdfDoc = await loadingTask.promise;
                    const pages = [];
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        const page = await pdfDoc.getPage(i);
                        const vp = page.getViewport({ scale: 1 });
                        pages.push({
                            id: 'pdf_pg_' + Date.now() + '_' + i,
                            template: 'blank',
                            width: Math.round(vp.width) || 595,
                            height: Math.round(vp.height) || 842,
                            pdfPageNum: i,
                            strokes: [],
                            items: []
                        });
                    }
                    const newPdfDoc = {
                        id: 'pdf_' + Date.now(),
                        title: file.name.replace(/\.pdf$/i, ''),
                        folder: 'ไฟล์ PDF',
                        isPdf: true,
                        pdfDataUrl: base64Data,
                        coverColor: '#E11D48',
                        updatedAt: Date.now(),
                        pages
                    };
                    appData.docs.unshift(newPdfDoc);
                    saveAllToStorage(false);
                    renderLibrary();
                    openDocumentInWorkspace(newPdfDoc.id);
                    showToast(`นำเข้า PDF สำเร็จ (${pdfDoc.numPages} หน้า)!`);
                };
                reader.readAsDataURL(file);
            } catch (err) {
                showToast('ไม่สามารถเปิดไฟล์ PDF นี้ได้ครับ');
            }
            input.value = '';
        }

        async function handleInsertPdfPagesIntoCurrentDoc(input) {
            const file = input.files[0];
            if (!file) return;
            const state = paneState[activePane];
            if (!state.doc) return;

            showToast('กำลังแทรกหน้า PDF ลงในสมุด... ⏳');
            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64Data = e.target.result;
                    const loadingTask = pdfjsLib.getDocument({ data: atob(base64Data.split(',')[1]) });
                    const pdfDoc = await loadingTask.promise;
                    const newPages = [];
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        const page = await pdfDoc.getPage(i);
                        const vp = page.getViewport({ scale: 1 });
                        newPages.push({
                            id: 'pdf_ins_' + Date.now() + '_' + i,
                            template: 'blank',
                            width: Math.round(vp.width) || 595,
                            height: Math.round(vp.height) || 842,
                            pdfPageNum: i,
                            customPdfDataUrl: base64Data,
                            strokes: [],
                            items: []
                        });
                    }
                    const insertAt = state.pageIndex + 1;
                    state.doc.pages.splice(insertAt, 0, ...newPages);
                    state.pageIndex = insertAt;
                    saveAllToStorage(false);
                    await renderPane(activePane);
                    showToast(`แทรกไฟล์ PDF เพิ่ม ${pdfDoc.numPages} หน้าเรียบร้อย!`);
                };
                reader.readAsDataURL(file);
            } catch (err) {
                showToast('ไม่สามารถแทรกไฟล์ PDF นี้ได้ครับ');
            }
            input.value = '';
        }

        // ==================== WORKSPACE & DUAL PANE ENGINE ====================
        async function openDocumentInWorkspace(docId) {
            const doc = appData.docs.find(d => d.id === docId);
            if (!doc) return;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('library-screen').classList.add('hidden');
            document.getElementById('workspace-screen').classList.remove('hidden');

            activePane = 1;
            await loadDocIntoPane(1, doc);
            fitZoom(1);

            if (isSplitScreen && paneState[2].doc) {
                await renderPane(2);
            }
        }

        async function loadDocIntoPane(paneNum, doc) {
            const state = paneState[paneNum];
            state.doc = doc;
            state.pageIndex = 0;
            state.undoStack = [];
            state.redoStack = [];
            state.pdfDoc = null;
            state.pdfCache = {};

            if (doc.isPdf && doc.pdfDataUrl && window.pdfjsLib) {
                try {
                    const raw = atob(doc.pdfDataUrl.split(',')[1]);
                    state.pdfDoc = await pdfjsLib.getDocument({ data: raw }).promise;
                } catch (e) {
                    console.warn('PDF load error:', e);
                }
            }

            if (paneNum === 1) {
                document.getElementById('workspace-doc-title').textContent = doc.title;
            } else {
                document.getElementById('pane-2-doc-title').textContent = doc.title;
            }

            await renderPane(paneNum);
        }

            saveAllToStorage(false);
            enterLibraryScreen();

            activePane = paneNum;

                p1Badge.textContent = activePane === 1 ? 'จอที่ 1 (กำลังใช้งาน)' : 'จอที่ 1';

                p1Badge.classList.add('hidden');
            }
        }

        // ==================== SPLIT SCREEN CONTROLS ====================
        async function toggleSplitScreen() {
            isSplitScreen = !isSplitScreen;
            const pane2 = document.getElementById('pane-2');
            const btnSplit = document.getElementById('btn-split-screen');
            const p1Badge = document.getElementById('pane-1-badge');

            if (isSplitScreen) {
                pane2.classList.remove('hidden');
                p1Badge.classList.remove('hidden');
                btnSplit.classList.add('bg-emerald-500', 'text-white');
                btnSplit.classList.remove('bg-white/15');

                if (!paneState[2].doc) {
                    const otherDoc = appData.docs.find(d => d.id !== paneState[1].doc?.id) || paneState[1].doc;
                    if (otherDoc) await loadDocIntoPane(2, otherDoc);
                }
                setTimeout(() => {
                    fitZoom(1);
                    fitZoom(2);
                }, 60);
                openSplitNotePickerModal();
            } else {
                pane2.classList.add('hidden');
                p1Badge.classList.add('hidden');
                btnSplit.classList.remove('bg-emerald-500');
                btnSplit.classList.add('bg-white/15');
                activePane = 1;
                setTimeout(() => fitZoom(1), 60);
            }
        }

        function toggleSplitOrientation() {
            isSplitHorizontal = !isSplitHorizontal;
            const container = document.getElementById('split-container');
            const pane2 = document.getElementById('pane-2');
            if (isSplitHorizontal) {
                container.classList.remove('flex-col');
                container.classList.add('flex-row');
                pane2.classList.remove('border-t-2');
                pane2.classList.add('border-l-2');
            } else {
                container.classList.remove('flex-row');
                container.classList.add('flex-col');
                pane2.classList.remove('border-l-2');
                pane2.classList.add('border-t-2');
            }
            setTimeout(() => {
                fitZoom(1);
                fitZoom(2);
            }, 60);
        }

        async function swapSplitDocs() {
            if (!paneState[1].doc || !paneState[2].doc) return;
            const tempDoc = paneState[1].doc;
            const tempIdx = paneState[1].pageIndex;
            await loadDocIntoPane(1, paneState[2].doc);
            paneState[1].pageIndex = paneState[2].pageIndex;
            await renderPane(1);

            await loadDocIntoPane(2, tempDoc);
            paneState[2].pageIndex = tempIdx;
            await renderPane(2);
            fitZoom(1);
            fitZoom(2);
            showToast('สลับตำแหน่งสมุดระหว่างจอที่ 1 และจอที่ 2 แล้ว');
        }

            const renderList = (filterText = '', folderFilter = 'ทั้งหมด') => {
                const q = filterText.toLowerCase().trim();

        async function selectDocForPane2(docId) {

        // ==================== RENDER PAGE ====================
        async function renderPane(paneNum) {
            const state = paneState[paneNum];
            if (!state.doc || !state.doc.pages || state.doc.pages.length === 0) return;

            if (state.pageIndex >= state.doc.pages.length) state.pageIndex = state.doc.pages.length - 1;
            if (state.pageIndex < 0) state.pageIndex = 0;

            const page = state.doc.pages[state.pageIndex];
            const wrapper = document.getElementById(`paper-wrapper-${paneNum}`);
            const pdfCanvas = document.getElementById(`pdf-canvas-${paneNum}`);
            const drawCanvas = document.getElementById(`draw-canvas-${paneNum}`);
            const mediaLayer = document.getElementById(`media-layer-${paneNum}`);

            const w = page.width || 595;
            const h = page.height || 842;
            wrapper.style.width = w + 'px';
            wrapper.style.height = h + 'px';
            wrapper.style.minWidth = w + 'px';
            wrapper.style.minHeight = h + 'px';

            wrapper.classList.remove('paper-grid', 'paper-lined', 'paper-cornell', 'paper-dotted');
            if (!page.pdfPageNum) {
                if (page.template === 'grid') wrapper.classList.add('paper-grid');
                else if (page.template === 'lined') wrapper.classList.add('paper-lined');
                else if (page.template === 'cornell') wrapper.classList.add('paper-cornell');
                else if (page.template === 'dotted') wrapper.classList.add('paper-dotted');
            }

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            drawCanvas.width = w * dpr;
            drawCanvas.height = h * dpr;

            const pdfCtx = pdfCanvas.getContext('2d');
            let activePdfDoc = state.pdfDoc;
            if (page.customPdfDataUrl && window.pdfjsLib) {
                if (!state.pdfCache[page.customPdfDataUrl]) {
                    try {
                        const raw = atob(page.customPdfDataUrl.split(',')[1]);
                        state.pdfCache[page.customPdfDataUrl] = await pdfjsLib.getDocument({ data: raw }).promise;
                    } catch (e) {}
                }
                activePdfDoc = state.pdfCache[page.customPdfDataUrl];
            }

            if (page.pdfPageNum && activePdfDoc) {
                pdfCanvas.width = w * dpr;
                pdfCanvas.height = h * dpr;
                try {
                    const pdfPage = await activePdfDoc.getPage(page.pdfPageNum);
                    const vp = pdfPage.getViewport({ scale: dpr });
                    await pdfPage.render({ canvasContext: pdfCtx, viewport: vp }).promise;
                } catch (e) {
                    pdfCtx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);
                }
            } else {
                pdfCanvas.width = w;
                pdfCanvas.height = h;
                pdfCtx.clearRect(0, 0, w, h);
            }

            document.getElementById(`page-indicator-${paneNum}`).textContent = `${state.pageIndex + 1} / ${state.doc.pages.length}`;

            renderVectorInk(paneNum);
            renderMediaItems(paneNum, mediaLayer, page);
        }

        function renderVectorInk(paneNum) {
            const state = paneState[paneNum];
            const page = state.doc.pages[state.pageIndex];
            const w = page.width || 595;
            const h = page.height || 842;

            const hlBackSvg = document.getElementById(`hl-back-svg-${paneNum}`);
            const inkSvg = document.getElementById(`vector-ink-svg-${paneNum}`);
            const hlFrontSvg = document.getElementById(`hl-front-svg-${paneNum}`);

            [hlBackSvg, inkSvg, hlFrontSvg].forEach(svg => {
                svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
                svg.innerHTML = '';
            });

            (page.strokes || []).forEach(st => {
                if (!st.points || st.points.length === 0) return;
                const d = st.points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', st.color);
                path.setAttribute('stroke-width', st.size);

                if (st.tool === 'highlighter') {
                    path.setAttribute('stroke-linecap', 'square');
                    path.setAttribute('stroke-linejoin', 'miter');
                    if (st.layer === 'front') {
                        path.setAttribute('stroke-opacity', '0.26');
                        hlFrontSvg.appendChild(path);
                    } else {
                        path.setAttribute('stroke-opacity', '0.45');
                        hlBackSvg.appendChild(path);
                    }
                } else {
                    path.setAttribute('stroke-linecap', 'round');
                    path.setAttribute('stroke-linejoin', 'round');
                    inkSvg.appendChild(path);
                }
            });
        }

                                <button type="button" onclick="event.stopPropagation(); shareOrDownloadAudioData('${item.url}', '${encodeURIComponent(item.title || 'บันทึกเสียง')}')" class="px-1.5 py-0.5 rounded bg-emerald-600 text-white hover:bg-emerald-700 text-[9px] flex items-center gap-1 shrink-0">

                makeItemDraggable(el, paneNum, idx);

        function makeItemDraggable(el, paneNum, idx) {
            let startX = 0, startY = 0, origX = 0, origY = 0, dragging = false;
            el.addEventListener('pointerdown', (e) => {
                if (e.target.closest('button, a, input, audio, video, iframe') || e.target.isContentEditable) return;
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                const item = paneState[paneNum].doc.pages[paneState[paneNum].pageIndex].items[idx];
                origX = item.x || 60;
                origY = item.y || 80;
                el.setPointerCapture(e.pointerId);
            });
            el.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const zoom = paneState[paneNum].zoom || 1;
                const dx = (e.clientX - startX) / zoom;
                const dy = (e.clientY - startY) / zoom;
                el.style.left = Math.max(0, origX + dx) + 'px';
                el.style.top = Math.max(0, origY + dy) + 'px';
            });
            el.addEventListener('pointerup', (e) => {
                if (!dragging) return;
                dragging = false;
                const zoom = paneState[paneNum].zoom || 1;
                const item = paneState[paneNum].doc.pages[paneState[paneNum].pageIndex].items[idx];
                if (item) {
                    item.x = Math.max(0, Math.round(origX + (e.clientX - startX) / zoom));
                    item.y = Math.max(0, Math.round(origY + (e.clientY - startY) / zoom));
                    saveAllToStorage(false);
                }
            });
        }

        function addMediaItemToPage(itemObj, targetPane = activePane) {
            const state = paneState[targetPane];
            if (!state.doc) return;
            const page = state.doc.pages[state.pageIndex];
            if (!page.items) page.items = [];
            const offset = (page.items.length % 5) * 25;
            page.items.push({
                x: 60 + offset,
                y: 80 + offset,
                ...itemObj
            });
            saveAllToStorage(false);
            renderPane(targetPane);
        }

        function updateTextItem(paneNum, idx, newText) {
            const page = paneState[paneNum].doc.pages[paneState[paneNum].pageIndex];
            if (page && page.items[idx]) {
                page.items[idx].text = newText;
                saveAllToStorage(false);
            }
        }

        function removeMediaItem(paneNum, idx) {
            const page = paneState[paneNum].doc.pages[paneState[paneNum].pageIndex];
            if (page && page.items) {
                page.items.splice(idx, 1);
                saveAllToStorage(false);
                renderPane(paneNum);
            }
        }

        // ==================== ZOOM & NAVIGATION ====================
        function adjustZoom(paneNum, delta) {
            const state = paneState[paneNum];
            state.zoom = Math.min(3, Math.max(0.4, +(state.zoom + delta).toFixed(2)));
            applyZoom(paneNum);
        }

        function fitZoom(paneNum) {
            const viewport = document.getElementById(`viewport-${paneNum}`);
            const state = paneState[paneNum];
            if (!viewport || !state.doc) return;
            const page = state.doc.pages[state.pageIndex];
            const availW = Math.max(240, viewport.clientWidth - 32);
            state.zoom = Math.min(1.5, Math.max(0.4, +(availW / (page.width || 595)).toFixed(2)));
            applyZoom(paneNum);
        }

        function applyZoom(paneNum) {
            const state = paneState[paneNum];
            const wrapper = document.getElementById(`paper-wrapper-${paneNum}`);
            wrapper.style.transform = `scale(${state.zoom})`;
            document.getElementById(`zoom-label-${paneNum}`).textContent = Math.round(state.zoom * 100) + '%';
        }

        async function changePage(paneNum, delta) {
            const state = paneState[paneNum];
            if (!state.doc) return;
            const nextIdx = state.pageIndex + delta;
            if (nextIdx >= 0 && nextIdx < state.doc.pages.length) {
                state.pageIndex = nextIdx;
                await renderPane(paneNum);
            }
        }

        async function deleteCurrentPage(forPane2 = false) {

        async function movePageOrder(paneNum, fromIdx, toIdx) {
            const state = paneState[paneNum];
            if (!state.doc || toIdx < 0 || toIdx >= state.doc.pages.length || fromIdx === toIdx) return;
            const [moved] = state.doc.pages.splice(fromIdx, 1);
            state.doc.pages.splice(toIdx, 0, moved);
            state.pageIndex = toIdx;
            saveAllToStorage(false);
            await renderPane(paneNum);
            openPageThumbnailsModal(paneNum === 2);
            showToast(`ย้ายไปที่หน้า ${toIdx + 1} เรียบร้อย!`);

        // ==================== TOOLS, HIGHLIGHTER & PALM REJECTION ====================

            [1, 2].forEach(p => {
                const c = document.getElementById(`draw-canvas-${p}`);

        // ==================== DRAWING & MULTI-TOUCH PINCH/ZOOM ENGINE ====================
        function attachCanvasEvents(paneNum) {
            const viewport = document.getElementById(`viewport-${paneNum}`);
            const canvas = document.getElementById(`draw-canvas-${paneNum}`);
            if (!viewport || !canvas) return;

            viewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    activePointerId = null;
                    currentStroke = null;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDist = Math.hypot(dx, dy);
                    initialPinchZoom = paneState[paneNum].zoom || 1;
                }
            }, { passive: false });

            viewport.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDist > 0) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    const scaleFactor = dist / initialPinchDist;
                    paneState[paneNum].zoom = Math.min(3, Math.max(0.4, +(initialPinchZoom * scaleFactor).toFixed(2)));
                    applyZoom(paneNum);
                }
            }, { passive: false });

            viewport.addEventListener('touchend', () => {
                initialPinchDist = 0;
            });

            canvas.addEventListener('pointerdown', (e) => {
                setActivePane(paneNum);

                if (palmRejectionEnabled && e.pointerType === 'touch') {
                    if ((e.width && e.width > 34) || (e.height && e.height > 34)) {
                        return;
                    }
                    if (activePointerId !== null && activePointerId !== e.pointerId) {
                        return;
                    }
                }

                const rect = canvas.getBoundingClientRect();
                const page = paneState[paneNum].doc.pages[paneState[paneNum].pageIndex];
                const x = ((e.clientX - rect.left) / rect.width) * (page.width || 595);
                const y = ((e.clientY - rect.top) / rect.height) * (page.height || 842);

                if (currentTool === 'text') {
                    addMediaItemToPage({ type: 'text', x, y, text: 'พิมพ์ข้อความ...', color: currentColor, fontSize: 16 }, paneNum);
                    selectTool('pen');
                    return;
                }

                activePointerId = e.pointerId;
                activeDrawingPane = paneNum;
                canvas.setPointerCapture(e.pointerId);

                if (currentTool === 'eraser') {
                    eraseAtPoint(paneNum, x, y);
                    return;
                }

                if (currentTool === 'lasso-ai' || currentTool === 'snip-move' || currentTool === 'lasso-read') {
                    lassoPoints = [{ x, y }];
                    return;
                }

                currentStroke = {
                    tool: currentTool,
                    color: currentColor,
                    size: currentSize,
                    layer: currentTool === 'highlighter' ? highlighterLayer : 'ink',
                    points: [{ x, y }]
                };
            });

            canvas.addEventListener('pointermove', (e) => {
                if (e.pointerId !== activePointerId || activeDrawingPane !== paneNum) return;
                const rect = canvas.getBoundingClientRect();
                const page = paneState[paneNum].doc.pages[paneState[paneNum].pageIndex];
                const x = ((e.clientX - rect.left) / rect.width) * (page.width || 595);
                const y = ((e.clientY - rect.top) / rect.height) * (page.height || 842);

                if (currentTool === 'eraser') {
                    eraseAtPoint(paneNum, x, y);
                    return;
                }

                const ctx = canvas.getContext('2d');
                const dpr = canvas.width / (page.width || 595);

                if (currentTool === 'lasso-ai' || currentTool === 'snip-move' || currentTool === 'lasso-read') {
                    lassoPoints.push({ x, y });
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.save();
                    ctx.scale(dpr, dpr);
                    ctx.strokeStyle = currentTool === 'lasso-read' ? '#4F46E5' : '#9333EA';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 4]);
                    ctx.beginPath();
                    lassoPoints.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                    ctx.stroke();
                    ctx.restore();
                    return;
                }

                if (!currentStroke) return;
                currentStroke.points.push({ x, y });

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.scale(dpr, dpr);
                ctx.strokeStyle = currentStroke.color;
                ctx.lineWidth = currentStroke.size;
                ctx.lineCap = currentStroke.tool === 'highlighter' ? 'square' : 'round';
                ctx.lineJoin = currentStroke.tool === 'highlighter' ? 'miter' : 'round';
                ctx.globalAlpha = currentStroke.tool === 'highlighter' ? 0.3 : 1;
                ctx.beginPath();
                currentStroke.points.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.stroke();
                ctx.restore();
            });

            const endPointer = (e) => {
                if (e.pointerId !== activePointerId) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if ((currentTool === 'lasso-ai' || currentTool === 'snip-move' || currentTool === 'lasso-read') && lassoPoints.length > 4) {
                    const toolUsed = currentTool;
                    const pts = [...lassoPoints];
                    lassoPoints = [];
                    activePointerId = null;
                    activeDrawingPane = null;
                    handleLassoAction(paneNum, toolUsed, pts);
                    return;
                }

                if (currentStroke && currentStroke.points.length > 0) {
                    const state = paneState[paneNum];
                    const page = state.doc.pages[state.pageIndex];
                    if (!page.strokes) page.strokes = [];
                    page.strokes.push(currentStroke);
                    state.undoStack.push(currentStroke);
                    state.redoStack = [];
                    renderVectorInk(paneNum);
                    saveAllToStorage(false);
                }

                currentStroke = null;
                activePointerId = null;
                activeDrawingPane = null;
            };

            canvas.addEventListener('pointerup', endPointer);
            canvas.addEventListener('pointercancel', endPointer);
        }

        function eraseAtPoint(paneNum, x, y) {
            const state = paneState[paneNum];
            const page = state.doc.pages[state.pageIndex];
            if (!page.strokes || page.strokes.length === 0) return;
            const threshold = Math.max(12, currentSize * 2);
            const beforeLen = page.strokes.length;
            page.strokes = page.strokes.filter(st => {
                return !st.points.some(p => Math.hypot(p.x - x, p.y - y) < threshold);
            });
            if (page.strokes.length !== beforeLen) {
                renderVectorInk(paneNum);
                saveAllToStorage(false);
            }
        }

        function undoStroke() {
            const state = paneState[activePane];
            const page = state.doc?.pages[state.pageIndex];
            if (!page || !page.strokes || page.strokes.length === 0) return;
            const popped = page.strokes.pop();
            state.redoStack.push(popped);
            renderVectorInk(activePane);
            saveAllToStorage(false);
        }

        function redoStroke() {
            const state = paneState[activePane];
            const page = state.doc?.pages[state.pageIndex];
            if (!page || state.redoStack.length === 0) return;
            const restored = state.redoStack.pop();
            page.strokes.push(restored);
            renderVectorInk(activePane);
            saveAllToStorage(false);
        }

        // ==================== LASSO ACTIONS ====================
        function handleLassoAction(paneNum, toolType, pts) {
            const xs = pts.map(p => p.x);
            const ys = pts.map(p => p.y);
            const minX = Math.max(0, Math.min(...xs) - 10);
            const minY = Math.max(0, Math.min(...ys) - 10);
            const maxX = Math.max(...xs) + 10;
            const maxY = Math.max(...ys) + 10;

            const page = paneState[paneNum].doc.pages[paneState[paneNum].pageIndex];
            const insideTexts = (page.items || [])
                .filter(it => it.type === 'text' && it.x >= minX - 20 && it.x <= maxX + 20 && it.y >= minY - 20 && it.y <= maxY + 20)
                .map(it => it.text)
                .join(' ');

            if (toolType === 'lasso-read') {
                openReadAloudModal(insideTexts);
                if (insideTexts && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(insideTexts);
                    u.lang = /[\u0E00-\u0E7F]/.test(insideTexts) ? 'th-TH' : 'en-US';
                    window.speechSynthesis.speak(u);
                }
            } else if (toolType === 'lasso-ai') {
                openAiStudyModal(insideTexts || 'อธิบายเนื้อหาส่วนที่วงไว้ให้เข้าใจง่าย');
            } else if (toolType === 'snip-move') {
                const srcCanvas = document.getElementById(`pdf-canvas-${paneNum}`);
                const crop = document.createElement('canvas');
                crop.width = Math.max(60, maxX - minX);
                crop.height = Math.max(60, maxY - minY);
                const cCtx = crop.getContext('2d');
                cCtx.fillStyle = '#FFFFFF';
                cCtx.fillRect(0, 0, crop.width, crop.height);
                if (srcCanvas && srcCanvas.width > 0) {
                    const scale = srcCanvas.width / (page.width || 595);
                    cCtx.drawImage(srcCanvas, minX * scale, minY * scale, crop.width * scale, crop.height * scale, 0, 0, crop.width, crop.height);
                }
                addMediaItemToPage({ type: 'image', url: crop.toDataURL('image/png'), width: Math.min(240, crop.width) }, paneNum);
                showToast('แคปส่วนที่เลือกวางเป็นการ์ดพร้อมย้ายแล้ว!');
            }
        }

        // ==================== MEDIA, UNIVERSAL VIDEO, LINK, VOICE & READ ALOUD ====================
        function extractYoutubeId(rawUrl) {
            if (!rawUrl) return null;
            const m = rawUrl.trim().match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : null;
        }

        function parseUniversalVideoUrl(rawUrl) {
            if (!rawUrl) return { mode: 'video', src: '' };
            const url = rawUrl.trim();
            if (url.startsWith('data:video/') || url.startsWith('blob:')) return { mode: 'video', src: url };
            const ytId = extractYoutubeId(url);
            if (ytId) {
                return {
                    mode: 'youtube',
                    isYoutube: true,
                    videoId: ytId,
                    src: `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&playsinline=1&rel=0`
                };
            }
            const gdMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (gdMatch) return { mode: 'iframe', src: `https://drive.google.com/file/d/${gdMatch[1]}/preview` };
            const vimeoMatch = url.match(/vimeo\.com\/(\d+)/);
            if (vimeoMatch) return { mode: 'iframe', src: `https://player.vimeo.com/video/${vimeoMatch[1]}` };
            if (/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(url)) return { mode: 'video', src: url };
            return { mode: 'iframe', src: url };
        }

        }

        // Voice Recorder & Export
        let activeMediaRecorder = null;
        let recordedAudioChunks = [];
        let lastRecordedAudioDataUrl = '';

        function openVoiceRecorderModal() {
            lastRecordedAudioDataUrl = '';
            showModal(
                'อัดเสียงลงสมุดโน๊ต & ส่งต่อที่อื่น 🎙️',
                `
                <div class="space-y-3 text-center">
                    <input type="text" id="audio-title-input" placeholder="ตั้งชื่อบันทึกเสียง (เช่น เลคเชอร์วิชาเคมี)..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm outline-none focus:border-gnPurple">
                    <div id="rec-status-box" class="py-3.5 px-3 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold">
                        กดปุ่ม "เริ่มอัดเสียง" ด้านล่างเพื่อบันทึกเสียงบรรยาย
                    </div>
                    <div class="flex justify-center gap-2">
                        <button type="button" id="btn-start-rec" onclick="startVoiceRecording()" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold text-xs flex items-center gap-1.5">
                            <i class="fa-solid fa-circle"></i> เริ่มอัดเสียง
                        </button>
                        <button type="button" id="btn-stop-rec" onclick="stopVoiceRecording()" disabled class="px-4 py-2 rounded-xl bg-slate-300 text-slate-600 font-bold text-xs flex items-center gap-1.5">
                            <i class="fa-solid fa-stop"></i> หยุดอัด
                        </button>
                    </div>
                    <div id="rec-preview-wrap" class="hidden space-y-2 pt-1">
                        <audio id="rec-preview-audio" controls class="w-full h-9"></audio>
                        <button type="button" onclick="shareRecordedVoiceNow()" class="w-full py-2 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-share-nodes"></i> ส่งต่อ / บันทึกไฟล์เสียงไปแอปอื่นทันที
                        </button>
                    </div>
                </div>
                `,
                [
                    {
                        text: 'ยกเลิก',
                        class: 'bg-slate-100 text-slate-700',
                        onClick: () => {
                            if (activeMediaRecorder && activeMediaRecorder.state !== 'inactive') activeMediaRecorder.stop();
                            closeModal();
                        }
                    },
                    {
                        text: 'วางลงหน้าโน๊ตนี้',
                        class: 'bg-emerald-600 text-white',
                        onClick: () => {
                            if (!lastRecordedAudioDataUrl) return showToast('กรุณาอัดเสียงให้เสร็จก่อนครับ');
                            const title = document.getElementById('audio-title-input').value.trim() || 'บันทึกเสียง';
                            addMediaItemToPage({ type: 'audio', title, url: lastRecordedAudioDataUrl, width: 270 });
                            closeModal();
                            showToast('บันทึกเสียงลงหน้านี้แล้ว!');
                        }
                    }
                ]
            );
        }

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recordedAudioChunks = [];
                activeMediaRecorder = new MediaRecorder(stream);
                activeMediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedAudioChunks.push(e.data); };
                activeMediaRecorder.onstop = () => {
                    const blob = new Blob(recordedAudioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        lastRecordedAudioDataUrl = reader.result;
                        const prevAudio = document.getElementById('rec-preview-audio');
                        const prevWrap = document.getElementById('rec-preview-wrap');
                        if (prevAudio && prevWrap) {
                            prevAudio.src = lastRecordedAudioDataUrl;
                            prevWrap.classList.remove('hidden');
                        }
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                activeMediaRecorder.start();
                document.getElementById('rec-status-box').textContent = '🔴 กำลังอัดเสียง... พูดได้เลยครับ';
                document.getElementById('btn-start-rec').disabled = true;
                document.getElementById('btn-stop-rec').disabled = false;
                document.getElementById('btn-stop-rec').classList.replace('bg-slate-300', 'bg-slate-800');
                document.getElementById('btn-stop-rec').classList.replace('text-slate-600', 'text-white');
            } catch (err) {
                showToast('กรุณาอนุญาตการใช้ไมโครโฟนก่อนอัดเสียงครับ');
            }
        }

        function stopVoiceRecording() {
            if (activeMediaRecorder && activeMediaRecorder.state !== 'inactive') {
                activeMediaRecorder.stop();
                document.getElementById('rec-status-box').textContent = '✅ อัดเสียงเสร็จแล้ว! กดฟังหรือส่งต่อได้เลย';
                document.getElementById('btn-start-rec').disabled = false;
                document.getElementById('btn-stop-rec').disabled = true;
            }
        }

        function shareRecordedVoiceNow() {
            if (!lastRecordedAudioDataUrl) return showToast('กรุณาอัดเสียงให้เสร็จก่อนครับ');
            const title = document.getElementById('audio-title-input').value.trim() || 'บันทึกเสียง_EnjoyNote';
            shareOrDownloadAudioData(lastRecordedAudioDataUrl, encodeURIComponent(title));
        }

        async function shareOrDownloadAudioData(audioDataUrl, encodedTitle) {
            const title = decodeURIComponent(encodedTitle || 'บันทึกเสียง_EnjoyNote').replace(/[^a-zA-Z0-9ก-๙_-]/g, '_');
            try {
                const res = await fetch(audioDataUrl);
                const blob = await res.blob();
                const fileName = `${title}.webm`;
                const file = new File([blob], fileName, { type: blob.type || 'audio/webm' });

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ title, text: `ไฟล์เสียงจาก Enjoy note`, files: [file] });
                    return;
                }
                const dlUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = dlUrl;
                a.download = fileName;
                a.click();
                setTimeout(() => URL.revokeObjectURL(dlUrl), 3000);
                showToast(`ดาวน์โหลดไฟล์เสียง "${fileName}" พร้อมส่งต่อแล้ว!`);
            } catch (e) {
                showToast('ไม่สามารถส่งออกไฟล์เสียงได้');
            }
        }

        function openReadAloudModal(prefillText = '') {
            const page = paneState[activePane].doc?.pages[paneState[activePane].pageIndex];
            const pageTexts = (page?.items || []).filter(i => i.type === 'text').map(i => i.text).join('\n');
            const defaultText = prefillText || pageTexts;

            showModal(
                'ระบบอ่านออกเสียง ภาษาไทย / อังกฤษ 🔊',
                `
                <div class="space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <select id="tts-lang-select" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold outline-none">
                            <option value="th-TH">🇹🇭 ภาษาไทย (Thai)</option>
                            <option value="en-US">🇺🇸 ภาษาอังกฤษ (English)</option>
                        </select>
                        <label class="cursor-pointer px-3 py-1.5 rounded-xl bg-purple-100 hover:bg-purple-200 text-gnPurple font-bold text-xs flex items-center gap-1.5">
                            <i class="fa-solid fa-file-import"></i>
                            <span>แนบไฟล์ให้อ่าน (PDF/TXT)</span>
                            <input type="file" accept=".pdf,.txt,.md,.csv" class="hidden" onchange="handleReadAloudFileUpload(this)">
                        </label>
                    </div>
                    <textarea id="tts-text-input" rows="5" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs outline-none focus:border-gnPurple" placeholder="พิมพ์ วางข้อความ หรือแนบไฟล์ PDF/TXT ด้านบน แล้วกดปุ่มเริ่มอ่านออกเสียง...">${defaultText}</textarea>
                </div>
                `,
                [
                    {
                        text: 'หยุดอ่าน',
                        class: 'bg-slate-100 text-slate-700',
                        onClick: () => { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }
                    },
                    {
                        text: '🔊 เริ่มอ่านออกเสียง',
                        class: 'bg-indigo-600 text-white',
                        onClick: () => {
                            const txt = document.getElementById('tts-text-input').value.trim();
                            const lang = document.getElementById('tts-lang-select').value;
                            if (!txt) return showToast('กรุณาใส่ข้อความก่อนกดอ่านออกเสียงครับ');
                            if ('speechSynthesis' in window) {
                                window.speechSynthesis.cancel();
                                const utter = new SpeechSynthesisUtterance(txt);
                                utter.lang = lang;
                                utter.rate = 0.96;
                                window.speechSynthesis.speak(utter);
                                showToast('กำลังอ่านออกเสียงตามคำสั่ง...');
                            }
                        }
                    },
                    {
                        text: 'ปิด',
                        class: 'bg-gnPurple text-white',
                        onClick: () => { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); closeModal(); }
                    }
                ]
            );
        }

        async function handleReadAloudFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const textarea = document.getElementById('tts-text-input');
            const langSel = document.getElementById('tts-lang-select');
            try {
                let text = '';
                if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) {
                    const buf = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
                    for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
                        const p = await pdf.getPage(i);
                        const tc = await p.getTextContent();
                        text += tc.items.map(it => it.str).join(' ') + '\n';
                    }
                } else {
                    text = await file.text();
                }
                textarea.value = text.trim();
                langSel.value = /[\u0E00-\u0E7F]/.test(textarea.value) ? 'th-TH' : 'en-US';
                showToast(`ดึงข้อความจาก "${file.name}" เรียบร้อย! กดปุ่มเริ่มอ่านได้เลย`);
            } catch (e) {
                showToast('ไม่สามารถอ่านไฟล์นี้ได้ครับ');
            }
            input.value = '';
        }

        // ==================== OTHER WORKSPACE HELPERS ====================
        function handleInsertImageToPage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                addMediaItemToPage({ type: 'image', url: e.target.result, width: 220 });
                showToast('แทรกรูปภาพลงหน้ากระดาษแล้ว!');
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

            const emojis = ['⭐', '❤️', '📌', '✅', '💡', '🔥', '🐶', '🐱', '🌸', '🎀', '📚', '✏️', '🎯', '🏆', '👏', '✨'];

                        <button type="button" onclick="addMediaItemToPage({type:'sticker', emoji:'${em}'}); closeModal();" class="text-3xl p-2 rounded-2xl hover:bg-purple-50 transition">${em}</button>
                    `).join('')}

        function openChangePaperTemplateModal() {
            const page = paneState[activePane].doc?.pages[paneState[activePane].pageIndex];
            if (!page || page.pdfPageNum) return showToast('หน้า PDF ไม่สามารถเปลี่ยนลายกระดาษพื้นหลังได้ครับ');
            const templates = [
                { id: 'lined', name: 'กระดาษมีเส้น' },
                { id: 'grid', name: 'กระดาษกราฟตาราง' },
                { id: 'cornell', name: 'กระดาษ Cornell' },
                { id: 'dotted', name: 'กระดาษจุดไข่ปลา' },
                { id: 'blank', name: 'กระดาษเปล่าสีขาว' }
            ];
            showModal(
                'เปลี่ยนลายกระดาษหน้านี้ 📝',
                `<div class="space-y-2">
                    ${templates.map(t => `
                        <button type="button" onclick="setPageTemplate('${t.id}')" class="w-full text-left px-4 py-2.5 rounded-xl border ${page.template === t.id ? 'border-gnPurple bg-purple-50 font-bold text-gnPurple' : 'border-slate-200 hover:bg-slate-50'} text-xs">
                            ${t.name}
                        </button>
                    `).join('')}
                </div>`,
                [{ text: 'ปิด', class: 'bg-slate-100 text-slate-700', onClick: () => closeModal() }]
            );
        }

        function setPageTemplate(tpl) {
            const page = paneState[activePane].doc?.pages[paneState[activePane].pageIndex];
            if (page) {
                page.template = tpl;
                saveAllToStorage(false);
                renderPane(activePane);
                closeModal();
            }
        }

        function openAiStudyModal(prefillPrompt = '') {
            showModal(
                'AI ผู้ช่วยสรุปบทเรียน ✨',
                `
                <div class="space-y-3">
                    <textarea id="ai-prompt-input" rows="3" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs outline-none focus:border-gnPurple" placeholder="พิมพ์หัวข้อหรือวางเนื้อหาที่อยากให้ช่วยสรุป...">${prefillPrompt}</textarea>
                    <div id="ai-response-box" class="p-3 rounded-xl bg-purple-50 border border-purple-200 text-xs text-slate-700 whitespace-pre-wrap min-h-[70px]">พิมพ์คำถามหรือเนื้อหาด้านบน แล้วกดปุ่ม "สรุป / อธิบาย" ได้เลยครับ</div>
                </div>
                `,
                [
                    { text: 'ปิด', class: 'bg-slate-100 text-slate-700', onClick: () => closeModal() },
                    {
                        text: 'วางคำตอบลงโน๊ต',
                        class: 'bg-emerald-600 text-white',
                        onClick: () => {
                            const ans = document.getElementById('ai-response-box').innerText.trim();
                            if (ans) {
                                addMediaItemToPage({ type: 'text', text: ans, color: '#4A2545', fontSize: 14 });
                                closeModal();
                                showToast('วางสรุปลงหน้ากระดาษแล้ว!');
                            }
                        }
                    },
                    {
                        text: '✨ สรุป / อธิบาย',
                        class: 'bg-gnPurple text-white',
                        onClick: async () => {
                            const q = document.getElementById('ai-prompt-input').value.trim();
                            const resBox = document.getElementById('ai-response-box');
                            if (!q) return showToast('กรุณาพิมพ์เนื้อหาก่อนครับ');
                            if (!navigator.onLine) {
                                resBox.textContent = `สรุปเบื้องต้น (โหมดออฟไลน์):\n• หัวข้อ: ${q}\n• เชื่อมต่ออินเทอร์เน็ตเพื่อใช้ AI วิเคราะห์เชิงลึกครับ`;
                                return;
                            }
                            resBox.textContent = 'กำลังวิเคราะห์และสรุปเนื้อหา... ⏳';
                            try {
                                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                                const resp = await fetch(apiUrl, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: `ช่วยสรุปและอธิบายเนื้อหานี้เป็นภาษาไทยให้เข้าใจง่าย กระชับ เป็นข้อๆ:\n${q}` }] }] })
                                });
                                const data = await resp.json();
                                const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                                resBox.textContent = reply || `สรุปประเด็นสำคัญจาก: "${q}"\n• จับใจความหลักและคำสำคัญ\n• ทบทวนความเชื่อมโยงของเนื้อหา`;
                            } catch (e) {
                                resBox.textContent = `สรุปประเด็นสำคัญจาก: "${q}"\n• จับใจความหลักของเนื้อหา\n• จดบันทึกคำสำคัญเพื่อทบทวน`;
                            }
                        }
                    }
                ]
            );
        }

        // ==================== MODAL & TOAST UI ====================
        function showModal(title, bodyHtml, buttons = []) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            const footer = document.getElementById('modal-footer');
            footer.innerHTML = '';
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = b.text;
                btn.className = `px-4 py-2 rounded-xl font-bold text-xs transition ${b.class || 'bg-slate-200 text-slate-800'}`;
                btn.onclick = b.onClick;
                footer.appendChild(btn);
            });
            document.getElementById('app-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('app-modal').classList.add('hidden');
        }

        let toastTimer = null;
        function showToast(msg) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-msg').textContent = msg;
            box.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => box.classList.add('opacity-0'), 2400);
        }

        // ==================== BOOTSTRAP ====================
        window.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            applyCustomAppLogo();
            updateOnlineStatusPill();
            attachCanvasEvents(1);
            attachCanvasEvents(2);
            if (appData.user) {
                enterLibraryScreen();
            }
        });
    </script>
